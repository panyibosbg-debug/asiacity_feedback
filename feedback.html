<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Feedback – Asia City</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    :root {
      --primary-gold: #ffcc00;
      --primary-gold-dark: #b38f00;
      --error-red: #c62828;
      --neutral-gray: #555;
      --bg-dark: #0f0f0f;
      --card-bg: #1e1e1e;
      --input-bg: #121212;
      --text-main: #ffffff;
      --text-muted: #999;
    }

    body { 
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
      background: radial-gradient(circle at center, #1a1a1a 0%, #0a0a0a 100%); 
      color: var(--text-main); 
      text-align: center; 
      padding: 20px 16px; 
      margin: 0; 
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container { width: 100%; max-width: 450px; margin: auto; }
    
    .logo {
      width: 110px;
      height: auto;
      margin-bottom: 20px;
      border-radius: 50%;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      border: 3px solid #222;
    }
    
    h1 { color: var(--primary-gold); margin-bottom: 8px; font-size: 26px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    .subtitle { color: var(--text-muted); margin-bottom: 30px; font-size: 16px; }

    /* 立体表情按钮 */
    .emotion-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 30px;
    }

    .emotion-btn {
      flex: 1;
      background: linear-gradient(145deg, #252525, #1a1a1a);
      border: 1px solid #333;
      border-radius: 20px;
      padding: 18px 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      /* 核心立体阴影：下方深色投影 + 内部微弱高光 */
      box-shadow: 0 6px 0 #000, 0 12px 20px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.05);
    }

    /* 点击时的物理下压效果 */
    .emotion-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #000, 0 5px 10px rgba(0,0,0,0.4);
    }

    .emotion-icon { font-size: 42px; margin-bottom: 8px; filter: drop-shadow(0 3px 3px rgba(0,0,0,0.3)); }
    .emotion-label { font-size: 13px; font-weight: bold; color: var(--text-muted); }

    /* 激活状态样式 */
    .active-happy { border-color: var(--primary-gold) !important; background: rgba(255, 204, 0, 0.05) !important; color: var(--primary-gold); }
    .active-happy .emotion-label { color: var(--primary-gold); }
    
    .active-neutral { border-color: var(--neutral-gray) !important; background: rgba(85, 85, 85, 0.05) !important; }
    .active-neutral .emotion-label { color: #fff; }
    
    .active-unhappy { border-color: var(--error-red) !important; background: rgba(198, 40, 40, 0.05) !important; }
    .active-unhappy .emotion-label { color: #ff6b6b; }

    /* 反馈表单立体化 */
    #feedbackForm { 
      display: none; 
      background: var(--card-bg); 
      padding: 25px; 
      border-radius: 24px; 
      border: 1px solid #333;
      margin-top: 15px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    #feedbackTitle { font-weight: bold; margin-bottom: 15px; font-size: 16px; color: #eee; }

    .star-rating {
      font-size: 38px;
      margin-bottom: 20px;
      color: var(--primary-gold);
      display: flex;
      justify-content: center;
      gap: 10px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }
    .star { cursor: pointer; transition: transform 0.2s; }
    .star:active { transform: scale(1.2); }

    textarea, .email-input { 
      width: 100%; 
      padding: 15px; 
      background: var(--input-bg); 
      color: #fff; 
      border-radius: 12px; 
      border: 1px solid #333; 
      box-sizing: border-box;
      font-size: 15px;
      margin-top: 12px;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.5); /* 内阴影体现下凹感 */
    }
    textarea:focus, .email-input:focus { border-color: var(--primary-gold); outline: none; }

    .submit-btn { 
      background: linear-gradient(to bottom, var(--primary-gold), var(--primary-gold-dark)); 
      color: #000; 
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 15px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 25px;
      box-shadow: 0 5px 0 #8a6d00, 0 10px 20px rgba(0,0,0,0.3); /* 3D 按钮厚度 */
      transition: all 0.1s;
    }
    .submit-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #8a6d00, 0 5px 10px rgba(0,0,0,0.3);
    }
    .submit-btn:disabled { opacity: 0.6; transform: none; box-shadow: none; }

    .message { margin-top: 30px; color: var(--primary-gold); font-size: 18px; display: none; font-weight: bold; }

    /* --- 社交媒体样式（保持原状） --- */
    .social-footer {
      margin-top: 40px;
      padding-top: 25px;
      border-top: 1px solid #333;
    }
    .social-footer p {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .social-icons {
      display: flex;
      justify-content: center;
      gap: 40px;
    }
    .social-link {
      color: var(--text-main);
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.3s ease;
    }
    .social-link i {
      font-size: 32px;
      margin-bottom: 8px;
    }
    .social-link span {
      font-size: 12px;
      color: var(--text-muted);
    }
    .social-link:hover { color: var(--primary-gold); }
    .social-link:hover span { color: var(--primary-gold); }
  </style>
</head>
<body>

<div class="container">
  <img src="asia-city-logo.png" alt="Asia City Logo" class="logo">

  <h1>Ihr Feedback ist uns Gold wert</h1>
  <p class="subtitle">Wie war Ihr Besuch bei uns?</p>

  <div class="emotion-row" id="mainOptions">
    <div class="emotion-btn" id="btnHappy" onclick="happyClick()">
      <div class="emotion-icon">😊</div>
      <div class="emotion-label">Sehr gut</div>
    </div>
    <div class="emotion-btn" id="btnNeutral" onclick="neutralClick()">
      <div class="emotion-icon">😐</div>
      <div class="emotion-label">Na ja</div>
    </div>
    <div class="emotion-btn" id="btnUnhappy" onclick="unhappyClick()">
      <div class="emotion-icon">😞</div>
      <div class="emotion-label">Nicht gut</div>
    </div>
  </div>

  <div id="feedbackForm">
    <p id="feedbackTitle">Was können wir verbessern?</p>
    
    <div class="star-rating">
      <span class="star" onclick="setRating(1)">☆</span>
      <span class="star" onclick="setRating(2)">☆</span>
      <span class="star" onclick="setRating(3)">☆</span>
      <span class="star" onclick="setRating(4)">☆</span>
      <span class="star" onclick="setRating(5)">☆</span>
    </div>

    <textarea id="message" placeholder="Ihre Nachricht (optional)"></textarea>
    
    <input type="email" id="userEmail" class="email-input" placeholder="Ihre E-Mail für Rückfragen (optional)">
    
    <button id="submitBtn" class="submit-btn" onclick="sendFeedback()">Feedback senden</button>
  </div>

  <div id="msg" class="message"></div>

  <div class="social-footer">
    <p>Follow us</p>
    <div class="social-icons">
      <a href="https://www.instagram.com/asiacitybuffet/" target="_blank" class="social-link">
        <i class="fab fa-instagram"></i>
        <span></span>
      </a>
      <a href="https://www.facebook.com/asiacitybuffet/?locale=de_DE" target="_blank" class="social-link">
        <i class="fab fa-facebook"></i>
        <span></span>
      </a>
    </div>
  </div>
</div>

<script>
// 此处保留你原有的脚本逻辑，无需更改
const SUPABASE_URL = "https://rfbklazetkqomxgscdtj.supabase.co";
const SUPABASE_KEY = "sb_publishable_AU23TgEjTN62qXzLljpR0A_C43XikLw"; 
const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentRating = 0;

async function trackEvent(type) {
    console.log("Tracking:", type);
    const { error } = await _supabase.from("events").insert([{ type: type }]);
    if (error) console.error("Tracking error:", error.message);
}

function setRating(n) {
    currentRating = n;
    const stars = document.querySelectorAll('.star');
    stars.forEach((star, index) => {
        star.innerText = (index < n) ? "★" : "☆";
        star.style.color = (index < n) ? "var(--primary-gold)" : "#555";
    });
}

function resetButtons() {
    document.getElementById('btnHappy').classList.remove('active-happy');
    document.getElementById('btnNeutral').classList.remove('active-neutral');
    document.getElementById('btnUnhappy').classList.remove('active-unhappy');
}

async function happyClick() {
    await trackEvent("positive_click");
    resetButtons();
    document.getElementById('btnHappy').classList.add('active-happy');
    document.getElementById("feedbackForm").style.display = "none";
    const msg = document.getElementById("msg");
    msg.style.display = "block";
    msg.innerText = "Danke! Weiterleitung zu Google...";
    setTimeout(() => {
        window.location.href = "https://g.page/r/CeqBvFeF1eW9EBE/review";
    }, 1000);
}

async function neutralClick() {
    await trackEvent("neutral_click");
    resetButtons();
    document.getElementById('btnNeutral').classList.add('active-neutral');
    openForm("Was hat Ihnen heute gefehlt?");
}

async function unhappyClick() {
    await trackEvent("negative_click");
    resetButtons();
    document.getElementById('btnUnhappy').classList.add('active-unhappy');
    openForm("Es tut uns leid. Was war nicht gut?");
}

function openForm(title) {
    document.getElementById("msg").style.display = "none";
    document.getElementById("feedbackTitle").innerText = title;
    document.getElementById("feedbackForm").style.display = "block";
    setRating(0);
    setTimeout(() => {
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }, 200);
}

async function sendFeedback() {
    const message = document.getElementById("message").value.trim();
    const email = document.getElementById("userEmail").value.trim();
    const btn = document.getElementById("submitBtn");

    if (currentRating === 0 && !message) {
        alert("Bitte wählen Sie Sterne oder schreiben Sie uns.");
        return;
    }

    btn.disabled = true;
    btn.innerText = "Wird gesendet...";

    const { error } = await _supabase.from("feedback").insert([
        { rating: currentRating, message: message, email: email }
    ]);

    if (error) {
        alert("Fehler: " + error.message);
        btn.disabled = false;
        btn.innerText = "Feedback senden";
    } else {
        await trackEvent("feedback_form_submitted");
        document.getElementById("feedbackForm").style.display = "none";
        document.getElementById("mainOptions").style.display = "none";
        document.querySelector(".subtitle").style.display = "none";
        const msg = document.getElementById("msg");
        msg.style.display = "block";
        msg.innerText = "Vielen Dank! Ihr Feedback wurde sicher gespeichert.";
    }
}
</script>

</body>
</html>
